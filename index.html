<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>中国象棋 · 双人联机</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- 大厅 -->
  <section id="lobby">
    <div class="lobby-box">
      <h1>中国象棋</h1>
      <p class="sub">纯前端 · P2P 双人联机</p>

      <div class="lobby-actions">
        <button id="btnCreate" class="btn primary">创建房间</button>
        <div class="divider"><span>或</span></div>
        <div class="join-row">
          <input id="roomInput" type="text" maxlength="6" placeholder="输入房间号" autocomplete="off">
          <button id="btnJoin" class="btn">加入房间</button>
        </div>
      </div>

      <p id="lobbyStatus" class="status"></p>

      <div id="hostPanel" class="hidden">
        <p class="room-label">房间号（发给你的对手）</p>
        <div class="room-code-row">
          <span id="roomCode" class="room-code">------</span>
          <button id="btnCopy" class="btn small">复制</button>
        </div>
        <p class="waiting">等待对手加入…</p>
      </div>

      <p id="manualEntry" class="alt-line">
        <button id="btnShowManual" class="link-btn">连不上？改用手动直连（无需任何服务器）</button>
      </p>

      <!-- 手动直连 -->
      <div id="manualPanel" class="hidden">
        <p class="manual-hint">双方复制粘贴两段码即可点对点直连，信令服务器挂了也能玩</p>

        <div id="manualRoles">
          <button id="btnManualHost" class="btn">我创建房间（执红先行）</button>
          <button id="btnManualGuest" class="btn">我加入房间（执黑后手）</button>
        </div>

        <div id="manualHost" class="hidden">
          <label class="mlabel">① 生成连接码，复制发给对方</label>
          <textarea id="offerOut" readonly rows="4" placeholder="点下面按钮生成"></textarea>
          <div class="mrow">
            <button id="btnGenOffer" class="btn small primary">生成连接码</button>
            <button id="btnCopyOffer" class="btn small">复制</button>
          </div>
          <label class="mlabel">② 粘贴对方发回的应答码，点连接</label>
          <textarea id="answerIn" rows="4" placeholder="粘贴应答码"></textarea>
          <div class="mrow">
            <button id="btnAcceptAnswer" class="btn small">连接</button>
          </div>
          <p id="manualStatusHost" class="status"></p>
        </div>

        <div id="manualGuest" class="hidden">
          <label class="mlabel">① 粘贴对方的连接码</label>
          <textarea id="offerIn" rows="4" placeholder="粘贴连接码"></textarea>
          <div class="mrow">
            <button id="btnGenAnswer" class="btn small primary">生成应答码</button>
          </div>
          <label class="mlabel">② 把应答码复制回给对方，等待连接</label>
          <textarea id="answerOut" readonly rows="4" placeholder="生成后显示在这里"></textarea>
          <div class="mrow">
            <button id="btnCopyAnswer" class="btn small">复制应答码</button>
          </div>
          <p id="manualStatusGuest" class="status"></p>
        </div>

        <p class="alt-line">
          <button id="btnBackAuto" class="link-btn">返回房间号连接</button>
        </p>
      </div>
    </div>
  </section>

  <!-- 对局 -->
  <section id="game" class="hidden">
    <header class="topbar">
      <div class="top-left">
        <span id="roomTag" class="tag">房间 ------</span>
        <span id="connTag" class="tag">连接中…</span>
      </div>
      <div id="turnTag" class="turn-tag">红方走棋</div>
      <div class="top-right">
        <span id="sideTag" class="tag">红方</span>
      </div>
    </header>

    <div class="main">
      <div class="board-col">
        <div id="board" aria-label="棋盘">
          <svg id="boardSvg" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="marks"></div>
          <div id="pieces"></div>
        </div>
        <p id="hint" class="hint">点击己方棋子，再点击高亮落点走棋</p>
      </div>

      <aside class="panel">
        <div class="panel-block">
          <h3>被吃棋子</h3>
          <div class="captured-row"><span class="lbl">我方损失</span><span id="capMine" class="caps"></span></div>
          <div class="captured-row"><span class="lbl">对方损失</span><span id="capTheirs" class="caps"></span></div>
        </div>
        <div class="panel-block grow">
          <h3>棋谱</h3>
          <ol id="moveLog" class="move-log"></ol>
        </div>
        <div class="panel-block actions">
          <button id="btnUndo" class="btn small">悔棋</button>
          <button id="btnResign" class="btn small danger">认输</button>
          <button id="btnRestart" class="btn small">再来一局</button>
          <button id="btnLeave" class="btn small ghost">退出</button>
        </div>
      </aside>
    </div>

    <div id="banner" class="banner hidden"></div>
  </section>

  <!-- 弹窗 -->
  <div id="overlay" class="overlay hidden">
    <div class="modal">
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <div id="modalBtns" class="modal-btns"></div>
    </div>
  </div>

</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1/dist/peerjs.min.js"></script>
<script src="js/rules.js"></script>
<script src="js/ui.js"></script>
<script src="js/net.js"></script>
<script src="js/main.js"></script>
</body>
</html>
