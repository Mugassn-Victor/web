<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>中国象棋 · 双人联机</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- 大厅 -->
  <section id="lobby">
    <div class="lobby-box">
      <h1>中国象棋</h1>
      <p class="sub">双人联机</p>

      <div class="lobby-actions">
        <button id="btnCreate" class="btn primary">创建房间</button>
        <div class="divider"><span>或</span></div>
        <div class="join-row">
          <input id="roomInput" type="text" maxlength="6" placeholder="输入房间号" autocomplete="off">
          <button id="btnJoin" class="btn">加入房间</button>
        </div>
        <div class="join-row hidden" id="roleRow">
          <button id="btnAsPlayer" class="btn">加入对战</button>
          <button id="btnAsWatch" class="btn ghost">观战</button>
        </div>
        <div class="join-row hidden" id="nickRow">
          <input id="nickInput" type="text" maxlength="12" placeholder="观战昵称（进房前必填）" autocomplete="off">
        </div>
      </div>

      <p id="lobbyStatus" class="status"></p>

      <div id="hostPanel" class="hidden">
        <p class="room-label">房间号（发给你的对手）</p>
        <div class="room-code-row">
          <span id="roomCode" class="room-code">------</span>
          <button id="btnCopy" class="btn small">复制</button>
        </div>
        <p class="waiting">等待对手加入…</p>
      </div>
      <div class="lobby-music"><button class="btn small ghost btnBgm">关音乐</button></div>
    </div>
  </section>

  <!-- 对局 -->
  <section id="game" class="hidden">
    <header class="topbar">
      <div class="top-left">
        <span id="roomTag" class="tag">房间 ------</span>
        <span id="connTag" class="tag">连接中…</span>
      </div>
      <div id="turnTag" class="turn-tag">红方走棋</div>
      <div class="top-right">
        <span id="sideTag" class="tag">红方</span>
      </div>
    </header>

    <div class="main">
      <div class="board-col">
        <div id="board" aria-label="棋盘">
          <svg id="boardSvg" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="marks"></div>
          <div id="pieces"></div>
        </div>


      </div>

      <aside class="panel">
        <div class="panel-block actions">
          <button id="btnUndo" class="btn small">悔棋</button>
          <button id="btnResign" class="btn small danger">认输</button>
          <button id="btnRestart" class="btn small">再来一局</button>
          <button id="btnLeave" class="btn small ghost">退出</button>
          <button class="btn small ghost btnBgm">关音乐</button>
        </div>
        <div id="chatLog" class="panel-block chatlog hidden"></div>
        <div class="panel-block chat">
          <input id="chatInput" type="text" maxlength="40" placeholder="请输入发言…" autocomplete="off">
          <button id="btnSend" class="btn small primary">发送</button>
        </div>
        <div class="panel-block voice">
          <button id="btnVoice" class="btn">按住说话</button>
          <span id="voiceState"></span>
        </div>
      </aside>
    </div>

    <div id="banner" class="banner hidden"></div>
  </section>

  <!-- 弹窗 -->
  <div id="overlay" class="overlay hidden">
    <div class="modal">
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <div id="modalBtns" class="modal-btns"></div>
    </div>
  </div>

</div>

<div id="toast" class="toast hidden"></div>

<script src="js/peerjs.min.js"></script>
<script src="js/mqttmini.js"></script>
<script src="js/rules.js"></script>
<script src="js/ui.js"></script>
<script src="js/net.js"></script>
<script src="js/main.js"></script>
</body>
</html>
