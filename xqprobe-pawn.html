<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>running</title></head>
<body>
<pre id="out"></pre>
<script src="js/rules.js"></script>
<script>
const out = [];
let pass = 0, fail = 0;
function check(n, c, extra) { if (c) { pass++; out.push('PASS ' + n); } else { fail++; out.push('FAIL ' + n + ' [' + extra + ']'); } }
function finish() {
  document.getElementById('out').textContent = out.join('\n');
  document.title = 'DONE pass=' + pass + ' fail=' + fail;
}
function run() {
  const st0 = Rules.derive([]);
  const ms0 = Rules.legalMovesFrom(st0, 'r', 6, 0);
  check('未过河红兵只能直走', ms0.length === 1 && ms0[0][0] === 5 && ms0[0][1] === 0, JSON.stringify(ms0));

  const st1 = Rules.derive([]);
  st1[6][0] = null; st1[4][0] = { side: 'r', type: 'P' };
  const ms1 = Rules.legalMovesFrom(st1, 'r', 4, 0);
  check('过河红兵(边)可前进', ms1.some(m => m[0] === 3 && m[1] === 0), JSON.stringify(ms1));
  check('过河红兵(边)可横走', ms1.some(m => m[0] === 4 && m[1] === 1), JSON.stringify(ms1));
  check('过河红兵(边)落点=2', ms1.length === 2, JSON.stringify(ms1));

  const st2 = Rules.derive([]);
  st2[6][4] = null; st2[4][4] = { side: 'r', type: 'P' };
  const ms2 = Rules.legalMovesFrom(st2, 'r', 4, 4);
  check('过河红兵(中)可左右横走',
    ms2.some(m => m[0] === 4 && m[1] === 3) && ms2.some(m => m[0] === 4 && m[1] === 5), JSON.stringify(ms2));

  const st3 = Rules.derive([]);
  st3[3][0] = null; st3[5][0] = { side: 'b', type: 'P' };
  const ms3 = Rules.legalMovesFrom(st3, 'b', 5, 0);
  check('过河黑卒(边)可前进+横走',
    ms3.some(m => m[0] === 6) && ms3.some(m => m[0] === 5 && m[1] === 1), JSON.stringify(ms3));

  const st4 = Rules.derive([]);
  st4[3][4] = null; st4[5][4] = { side: 'b', type: 'P' };
  const ms4 = Rules.legalMovesFrom(st4, 'b', 5, 4);
  check('过河黑卒(中)可左右横走',
    ms4.some(m => m[0] === 5 && m[1] === 3) && ms4.some(m => m[0] === 5 && m[1] === 5), JSON.stringify(ms4));
  finish();
}
run();
</script>
</body></html>
