<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>running</title></head>
<body>
<pre id="out"></pre>
<script src="js/rules.js"></script>
<script>
const out = [];
let pass = 0, fail = 0;
function check(n, c, extra) { if (c) { pass++; out.push('PASS ' + n); } else { fail++; out.push('FAIL ' + n + ' [' + extra + ']'); } }
function finish() {
  document.getElementById('out').textContent = out.join('\n');
  document.title = 'DONE pass=' + pass + ' fail=' + fail;
}
function craft(setup, side) {
  const st = Rules.initialState();
  for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) st[r][c] = null;
  setup.forEach(function (x) { st[x[0]][x[1]] = { side: x[2], type: x[3] }; });
  const stt = Rules.status(st, side);
  return { stt: stt, pat: Rules.matePattern(st, side) };
}
function run() {
  let m;

  // 马后炮：炮(6,4)以马(2,4)为架，车(1,0)封锁将门横线
  m = craft([[9, 4, 'r', 'K'], [6, 4, 'r', 'C'], [2, 4, 'r', 'N'], [1, 0, 'r', 'R'], [0, 4, 'b', 'K']], 'b');
  check('马后炮', m.stt.reason === 'checkmate' && m.pat === '马后炮',
    m.stt.reason + '/' + m.pat);

  // 对面笑：将帅照面且黑方无路可走
  m = craft([[9, 4, 'r', 'K'], [1, 3, 'r', 'R'], [1, 5, 'r', 'R'], [3, 3, 'r', 'N'], [0, 4, 'b', 'K']], 'b');
  check('对面笑', m.stt.reason === 'checkmate' && m.pat === '对面笑',
    m.stt.reason + '/' + m.pat);

  // 困毙：黑将未被照将但无子可动
  m = craft([[9, 4, 'r', 'K'], [2, 2, 'r', 'N'], [2, 6, 'r', 'N'], [1, 0, 'r', 'R'], [5, 4, 'r', 'P'], [0, 4, 'b', 'K']], 'b');
  check('困毙', m.stt.reason === 'stalemate' && m.pat === '困毙',
    m.stt.reason + '/' + m.pat);

  // 多棋型同时符合：重炮 + 钓鱼马 + 夹车炮（顿号分隔全显示）
  m = craft([[9, 4, 'r', 'K'], [3, 4, 'r', 'C'], [5, 4, 'r', 'C'], [2, 2, 'r', 'N'], [2, 6, 'r', 'N'], [1, 0, 'r', 'R'], [0, 4, 'b', 'K']], 'b');
  check('多棋型顿号全显示', m.stt.reason === 'checkmate' && m.pat === '重炮、钓鱼马、夹车炮',
    m.stt.reason + '/' + m.pat);

  // 双将 + 附带棋型：车(5,4)/马(2,3)/车(0,0) 多子照将，车(1,0)与马(2,6)封锁退路
  m = craft([[9, 4, 'r', 'K'], [0, 0, 'r', 'R'], [5, 4, 'r', 'R'], [1, 0, 'r', 'R'], [2, 3, 'r', 'N'], [2, 6, 'r', 'N'], [0, 4, 'b', 'K']], 'b');
  check('双将开头且多棋型', m.stt.reason === 'checkmate' && m.pat.indexOf('双将') === 0 && m.pat.indexOf('、') > 0,
    m.stt.reason + '/' + m.pat);

  // 非终局返回 null；将死但无命名棋型兜底「绝杀」不可测（至少含双将），验证将帅被擒路径外的入口
  const st0 = Rules.initialState();
  check('非终局返回null', Rules.matePattern(st0, 'r') === null, String(Rules.matePattern(st0, 'r')));

  finish();
}
run();
</script>
</body></html>
